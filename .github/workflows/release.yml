name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test
        run: go test -tags integration ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            export GOOS GOARCH
            name="scip-plsql_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "$RUNNER_TEMP/$name"
            binary=scip-plsql
            if [ "$GOOS" = windows ]; then binary=scip-plsql.exe; fi
            go build -trimpath -tags integration -o "$RUNNER_TEMP/$name/$binary" ./cmd/scip-plsql
            cp LICENSE README.md "$RUNNER_TEMP/$name/"
            if [ "$GOOS" = windows ]; then
              (cd "$RUNNER_TEMP/$name" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" "$binary" LICENSE README.md)
            else
              tar -C "$RUNNER_TEMP/$name" -czf "dist/$name.tar.gz" "$binary" LICENSE README.md
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Sign artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$VERSION" dist/* --verify-tag --generate-notes --prerelease
          else
            gh release create "$VERSION" dist/* --verify-tag --generate-notes
          fi
